[project]
name = "autolab"
version = "0.1.0"
description = "AutoLab: a self-improving robotics experimentation harness"
requires-python = ">=3.11"
dependencies = ["numpy", "pydantic>=2", "fastapi", "uvicorn", "pymongo", "httpx"]

[project.optional-dependencies]
dev = ["pytest"]
vision = ["opencv-contrib-python"]
sim = ["mujoco==3.10.0", "mink==1.3.0", "qpsolvers[daqp]", "ruckig==0.19.4"]

[tool.setuptools]
packages = ["shared", "harness", "evaluation", "simulation", "robot_gateway", "agents", "agents.operator", "agents.scientist", "orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
